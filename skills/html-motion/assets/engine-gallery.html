<!doctype html>
<html lang="en" data-deck="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="requires-js" content="canvas and WebGL demos; a noscript list names every engine">
<title>html-motion engine gallery</title>
<script>
  /* Theme before first paint: ?deck=light|dark wins, else the system setting. */
  (function () {
    var d = new URLSearchParams(location.search).get('deck');
    if (d !== 'light' && d !== 'dark') d = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.setAttribute('data-deck', d);
  })();
</script>
<style>
  /* The ten tokens engines read. Registered so a theme switch glides through the canvases. Neutral, unbranded. */
  @property --bg      { syntax: '<color>'; inherits: true; initial-value: #101214; }
  @property --surface { syntax: '<color>'; inherits: true; initial-value: #171a1d; }
  @property --panel   { syntax: '<color>'; inherits: true; initial-value: #1f2327; }
  @property --line    { syntax: '<color>'; inherits: true; initial-value: #2c3238; }
  @property --ink     { syntax: '<color>'; inherits: true; initial-value: #e8eaec; }
  @property --muted   { syntax: '<color>'; inherits: true; initial-value: #9aa3ab; }
  @property --hi      { syntax: '<color>'; inherits: true; initial-value: #3fb8af; }
  @property --ok      { syntax: '<color>'; inherits: true; initial-value: #5bbf7a; }
  @property --alt     { syntax: '<color>'; inherits: true; initial-value: #e0a458; }
  @property --risk    { syntax: '<color>'; inherits: true; initial-value: #e5645a; }
  :root {
    --bg: #101214; --surface: #171a1d; --panel: #1f2327; --line: #2c3238; --ink: #e8eaec; --muted: #9aa3ab;
    --hi: #3fb8af; --ok: #5bbf7a; --alt: #e0a458; --risk: #e5645a;
    --radius: 2px;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI Variable Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, "Liberation Mono", monospace;
    transition: --bg .35s, --surface .35s, --panel .35s, --line .35s, --ink .35s, --muted .35s, --hi .35s, --ok .35s, --alt .35s, --risk .35s;
  }
  :root[data-deck="light"] {
    --bg: #f6f5f2; --surface: #ffffff; --panel: #ecebe7; --line: #d5d3cd; --ink: #1c1f22; --muted: #5c646b;
    --hi: #0f7d76; --ok: #2b7a47; --alt: #9a6a12; --risk: #b3372e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); line-height: 1.5; }
  header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 18px; font-weight: 600; }
  .eyebrow { font: 11px/1.2 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  nav { display: flex; gap: 12px; align-items: center; }
  button, .btn { font: 12px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 12px; cursor: pointer; text-decoration: none; }
  button:hover, .btn:hover { border-color: var(--hi); }
  button:active { background: var(--panel); }
  :focus-visible { outline: 2px solid var(--hi); outline-offset: 2px; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 16px; padding: 24px; }
  main.solo { grid-template-columns: minmax(0, 1100px); justify-content: center; }
  article { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); display: flex; flex-direction: column; min-width: 0; }
  article[hidden] { display: none; }
  .stage { position: relative; aspect-ratio: 16 / 9; background: var(--bg); border-bottom: 1px solid var(--line); overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  .info { display: grid; gap: 6px; padding: 14px 16px 16px; }
  h2 { margin: 0; font: 600 13px/1.2 var(--mono); letter-spacing: .1em; text-transform: uppercase; }
  p { margin: 0; color: var(--muted); font-size: 14px; max-width: 60ch; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 6px; }
  .tag { font: 11px/1 var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: var(--radius); padding: 4px 6px; }
  #msg { padding: 0 24px; color: var(--risk); font: 13px var(--mono); }
  @media (prefers-reduced-motion: reduce) { :root { transition: none; } * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<header>
  <div>
    <div class="eyebrow">html-motion</div>
    <h1>Engine gallery</h1>
  </div>
  <nav aria-label="Gallery controls">
    <a class="btn" id="all" href="?" hidden>All engines</a>
    <button id="theme" type="button" aria-pressed="false">Theme: dark</button>
  </nav>
</header>
<div id="msg" role="status"></div>
<main id="grid"></main>
<noscript>
  <section style="padding:1rem 1.5rem;max-width:60rem">
    <h2>Engines</h2>
    <p>The live engine demos are canvas and WebGL and need JavaScript. This is what each engine shows:</p>
    <ul>
    <li><strong>streams</strong>: Things moving at different rates (2D)</li>
    <li><strong>graph</strong>: A network with travelers along its links (2D)</li>
    <li><strong>expand</strong>: Reach growing around a fixed core (2D)</li>
    <li><strong>pullback</strong>: One unit, then the whole grid, then work passing between (2D)</li>
    <li><strong>split</strong>: One stream dividing into two branches (2D)</li>
    <li><strong>transform</strong>: A familiar object becoming a larger version of itself (showpiece) (2D)</li>
    <li><strong>morph</strong>: One passage of text becoming another, with lost words drifting off (2D)</li>
    <li><strong>shader</strong>: A full-surface flowing field or contour map (GPU)</li>
    <li><strong>terrain</strong>: A camera flying over a 3D landscape, with data columns and pinned labels (GPU)</li>
    </ul>
  </section>
</noscript>

<script>

/* html-motion core: shared runtime for every engine. Zero dependencies. Always inlined first.

 *   W, H     drawing space in CSS pixels (default: the canvas's client size). The backing store is W*res x H*res,

 *   start()  runs the loop. Under prefers-reduced-motion it paints one COMPLETE final frame and does not loop.
 *   stop()   cancels the loop (the last frame stays on the canvas).
 *   redraw() repaints the current frame; call after a theme or token change.
 *   drawAt(t) paints the frame for t seconds. Exact for "pure" engines; stateful engines replay a seeded
 *            simulation from 0 in 1/30 s steps, so the same t gives the same frame.
 *   set(obj) changes options live (engines read options every frame where noted in their header).
 *   A draw function may return 'freeze' to end its own loop; the last frame stays.

 *   a background), dpr (cap, <= 2), quality (GPU resolution multiplier), css (false: page sizes the canvas), seed.
 *

 *   --bg --surface --panel --line --ink --muted --hi --ok --alt --risk

 *

 *   count 90         particles in total, spread across lanes

 *   colors ['--hi','--alt','--ok']   token names, one per lane group
 *   dir 'x'|'y'      flow direction

    var n = e.target.getAttribute && e.target.getAttribute('data-replay');

    live.forEach(function (b) { if (b.it.name === n) b.build(); });
  });

  var btn = document.getElementById('theme');
  function label() { var d = document.documentElement.getAttribute('data-deck'); btn.textContent = 'Theme: ' + d; btn.setAttribute('aria-pressed', String(d === 'light')); }
  btn.addEventListener('click', function () {
    var r = document.documentElement, d = r.getAttribute('data-deck') === 'dark' ? 'light' : 'dark';
    r.setAttribute('data-deck', d); label();
    setTimeout(function () { live.forEach(function (b) { b.eng.redraw(); }); }, 420); // repaint engines that are not looping
  });
  label();
})();
</script>
</body>
</html>
