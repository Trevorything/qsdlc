<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="brand-source" content="unbranded">
<title>Status (ambient)</title>
<!--
  html-motion ambient skeleton: an always-on page for a wall display, kiosk, or desktop-background web view.
  Copy it, then change: the STATUS table (words), the engine/options in build(), and the poll() source.
  Preview any state without a server:  ?level=ok|warn|risk   &stale=1   &deck=light|dark   &fps=1
  The engine block below is produced by:  python scripts/inline_engines.py ambient.html streams
  Rules it implements: 30 fps cap, stop when hidden, rebuild on resize, stale looks stale, nothing interactive,
  follows the system light/dark setting, state changes go through tokens/text/options, never a reload.
-->
<style>
  /* Tokens engines read (neutral, unbranded). Replace with your product's values. Registered so changes glide. */
  @property --bg      { syntax: '<color>'; inherits: true; initial-value: #101214; }
  @property --surface { syntax: '<color>'; inherits: true; initial-value: #171a1d; }
  @property --panel   { syntax: '<color>'; inherits: true; initial-value: #1f2327; }
  @property --line    { syntax: '<color>'; inherits: true; initial-value: #2c3238; }
  @property --ink     { syntax: '<color>'; inherits: true; initial-value: #e8eaec; }
  @property --muted   { syntax: '<color>'; inherits: true; initial-value: #9aa3ab; }
  @property --hi      { syntax: '<color>'; inherits: true; initial-value: #3fb8af; }
  @property --ok      { syntax: '<color>'; inherits: true; initial-value: #5bbf7a; }
  @property --alt     { syntax: '<color>'; inherits: true; initial-value: #e0a458; }
  @property --risk    { syntax: '<color>'; inherits: true; initial-value: #e5645a; }
  :root {
    --bg: #101214; --surface: #171a1d; --panel: #1f2327; --line: #2c3238; --ink: #e8eaec; --muted: #9aa3ab;
    --hi: #3fb8af; --ok: #5bbf7a; --alt: #e0a458; --risk: #e5645a;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI Variable Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", Consolas, "Liberation Mono", monospace;
    transition: --bg 1.2s, --hi 1.2s, --ok 1.2s, --alt 1.2s, --risk 1.2s, --ink 1.2s, --muted 1.2s, --line 1.2s;
  }
  :root[data-deck="light"] {
    --bg: #f6f5f2; --surface: #ffffff; --panel: #ecebe7; --line: #d5d3cd; --ink: #1c1f22; --muted: #5c646b;
    --hi: #0f7d76; --ok: #2b7a47; --alt: #9a6a12; --risk: #b3372e;
  }
  /* State = which token the lead colour (--hi) points at. Stale = everything goes grey. */
  :root[data-level="warn"] { --hi: var(--alt); }
  :root[data-level="risk"] { --hi: var(--risk); }
  :root[data-level="ok"]   { --hi: var(--ok); }
  :root[data-stale="1"]    { --hi: var(--muted); --ok: var(--muted); --alt: var(--muted); --risk: var(--muted); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; transition: filter 1.2s, opacity 1.2s; }
  [data-stale="1"] canvas { filter: saturate(0); opacity: .55; }
  /* Few words, large, low contrast, clear of the menu bar, Dock and desktop icons. */
  .status { position: fixed; left: 8vw; bottom: 14vh; padding: 14px 22px; background: color-mix(in srgb, var(--bg) 85%, transparent); pointer-events: none; user-select: none; }
  .word { margin: 0; font-size: clamp(40px, 8vw, 120px); font-weight: 600; letter-spacing: -.02em; line-height: 1; color: var(--ink); opacity: .86; }
  .sub { margin: 14px 0 0; font: clamp(12px, 1.4vw, 18px)/1.3 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  /* Nothing on this page is interactive, but anything you add (a pause button, a link) must show keyboard focus. */
  :focus-visible { outline: 2px solid var(--hi); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { :root { transition: none; } canvas { transition: none; } }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<main class="status">
  <h1 class="word" id="word">Healthy</h1>
  <p class="sub" id="sub" role="status" aria-live="polite">Last update just now</p>
</main>

    ok:   { word: 'Healthy',  speed: 1.0 },
    warn: { word: 'Degraded', speed: 0.55 },
    risk: { word: 'At risk',  speed: 0.25 }
  };
  Engines.maxFps = 30;                    // hours-long page: cap the frame rate

  /* ---- theme: follow the system, ?deck= overrides for preview ----------------------------------------- */
  var mq = matchMedia('(prefers-color-scheme: light)');
  function deck() { var d = Q.get('deck'); root.setAttribute('data-deck', d === 'light' || d === 'dark' ? d : (mq.matches ? 'light' : 'dark')); }
  deck(); if (mq.addEventListener) mq.addEventListener('change', function () { deck(); if (eng) eng.redraw(); });

  /* ---- state ------------------------------------------------------------------------------------------- */
  var level = STATUS[Q.get('level')] ? Q.get('level') : 'ok';
  var lastAt = Q.get('stale') === '1' ? Date.now() - STALE_MS - 1000 : Date.now();
  var forcedStale = Q.get('stale') === '1';
  var eng = null, cv = document.getElementById('bg'), word = document.getElementById('word'), sub = document.getElementById('sub');

  function ago(ms) { var s = Math.max(0, Math.round(ms / 1000)); return s < 90 ? s + ' s' : s < 5400 ? Math.round(s / 60) + ' min' : Math.round(s / 3600) + ' h'; }
  function render() { // text + tokens only: never a reload, never an engine restart
    var stale = forcedStale || Date.now() - lastAt > STALE_MS, t = new Date(lastAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    root.setAttribute('data-level', level); root.setAttribute('data-stale', stale ? '1' : '0');
    word.textContent = stale ? 'No recent data' : STATUS[level].word;
    sub.textContent = (stale ? 'Stale. ' : '') + 'Last update ' + t + ' (' + ago(Date.now() - lastAt) + ' ago)';
    if (eng) eng.set({ speedScale: stale ? 0.12 : STATUS[level].speed });
  }

  /* ---- engine: build once, rebuild on resize (the page may move between displays) --------------------- */
  function build() {
    if (eng) eng.destroy();
    eng = Engines.streams(cv, { W: innerWidth, H: innerHeight, css: false, lanes: 7, count: 70, speed: [30, 170], colors: ['--hi'], size: 1.8, speedScale: STATUS[level].speed });
    eng.start(); render();
  }
  var rz = 0; addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(build, 200); });
  // Engines stop themselves while the tab/window is hidden (document.hidden) and resume with a continuous clock.

  /* ---- live data (optional) --------------------------------------------------------------------------- */
  function poll() {
    if (!ENDPOINT) return;
    fetch(ENDPOINT, { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
      if (STATUS[d.level]) level = d.level; lastAt = d.at || Date.now(); forcedStale = false; render();
    }).catch(function () { /* keep the last state; it will go stale on its own */ });
  }
  build(); poll();
  setInterval(poll, POLL_MS);
  setInterval(render, 15000);             // keeps "x min ago" and the stale flip honest
})();
</script>
</body>
</html>
